<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">日本 Xserver 初期架构</title>
  <desc id="desc">用户通过 DNS 和 HTTPS 访问位于日本的 Xserver VPS，入口层转发到应用、后台任务和数据库，备份发送到异地存储。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e3a8a"/><stop offset="1" stop-color="#3730a3"/></linearGradient>
    <linearGradient id="backup" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#115e59"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#67e8f9"/></marker>
  </defs>
  <rect width="1400" height="760" rx="32" fill="url(#bg)"/>
  <text x="70" y="72" fill="#f8fafc" font-size="38" font-family="sans-serif" font-weight="700">日本 Xserver 初期架构</text>
  <text x="70" y="113" fill="#94a3b8" font-size="21" font-family="sans-serif">先用一台 VPS 做清晰的单机部署，再为拆分和迁移留下边界</text>
  <g font-family="sans-serif" text-anchor="middle" filter="url(#shadow)">
    <rect x="75" y="275" width="190" height="110" rx="20" fill="#334155" stroke="#94a3b8" stroke-width="2"/><text x="170" y="322" fill="#f8fafc" font-size="26" font-weight="700">用户</text><text x="170" y="354" fill="#cbd5e1" font-size="17">日本及海外访问者</text>
    <rect x="330" y="275" width="190" height="110" rx="20" fill="#334155" stroke="#67e8f9" stroke-width="2"/><text x="425" y="322" fill="#f8fafc" font-size="26" font-weight="700">DNS / CDN</text><text x="425" y="354" fill="#cbd5e1" font-size="17">域名、缓存、TLS</text>
    <rect x="590" y="170" width="560" height="360" rx="26" fill="url(#server)" stroke="#a5b4fc" stroke-width="3"/><text x="870" y="215" fill="#f8fafc" font-size="28" font-weight="700">Xserver VPS（日本区域）</text>
    <rect x="630" y="255" width="220" height="100" rx="16" fill="#0f172a" stroke="#67e8f9" stroke-width="2"/><text x="740" y="296" fill="#f8fafc" font-size="23" font-weight="700">反向代理</text><text x="740" y="327" fill="#bae6fd" font-size="16">80/443 · 访问日志</text>
    <rect x="890" y="255" width="220" height="100" rx="16" fill="#0f172a" stroke="#c4b5fd" stroke-width="2"/><text x="1000" y="296" fill="#f8fafc" font-size="23" font-weight="700">应用容器</text><text x="1000" y="327" fill="#ddd6fe" font-size="16">Web · API · Worker</text>
    <rect x="630" y="395" width="220" height="92" rx="16" fill="#0f172a" stroke="#5eead4" stroke-width="2"/><text x="740" y="432" fill="#f8fafc" font-size="22" font-weight="700">数据库</text><text x="740" y="461" fill="#ccfbf1" font-size="16">仅内网 · 定期备份</text>
    <rect x="890" y="395" width="220" height="92" rx="16" fill="#0f172a" stroke="#fcd34d" stroke-width="2"/><text x="1000" y="432" fill="#f8fafc" font-size="22" font-weight="700">队列 / 缓存</text><text x="1000" y="461" fill="#fef3c7" font-size="16">异步任务 · 限流</text>
    <rect x="1200" y="275" width="145" height="110" rx="20" fill="url(#backup)" stroke="#5eead4" stroke-width="2"/><text x="1272" y="316" fill="#f8fafc" font-size="23" font-weight="700">异地备份</text><text x="1272" y="348" fill="#ccfbf1" font-size="16">对象存储</text>
  </g>
  <g fill="none" stroke="#67e8f9" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M265 330h55"/><path d="M520 330h55"/><path d="M850 305h30"/><path d="M1000 365v22"/><path d="M850 441h30"/><path d="M1155 330h35"/>
  </g>
  <path d="M1000 495 C1080 580 1160 580 1270 405" fill="none" stroke="#5eead4" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
  <g font-family="sans-serif" fill="#cbd5e1" font-size="19">
    <text x="90" y="620">安全边界：数据库和缓存不开放公网端口，SSH 仅允许管理来源，密钥放在受保护的环境变量中。</text>
    <text x="90" y="658">演进方向：流量增长后，再把数据库、Worker 或备份任务拆到独立节点，不在第一天过度分布式。</text>
    <text x="90" y="706" fill="#94a3b8">图示是初期设计，不代表某一台已部署服务器的实时状态。</text>
  </g>
</svg>
